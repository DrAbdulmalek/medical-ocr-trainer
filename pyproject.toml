[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-ocr-trainer"
version = "1.2.0"
description = "Multi-engine Medical OCR training and evaluation platform with ensemble support"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Dr. Abdulmalek Tamer Al-husseini", email = "drabdulmalek@proton.me"}
]
keywords = ["medical-ocr", "ocr", "handwriting", "arabic", "nlp", "deep-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "rapidfuzz>=2.13.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "pillow>=10.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "medical-ocr-benchmarks @ git+https://github.com/DrAbdulmalek/medical-ocr-benchmarks.git@main",
]

[project.optional-dependencies]
# Lite: PaddleOCR + Tesseract only (~350MB models)
lite = [
    "streamlit>=1.38.0",
    "paddleocr>=2.7.0",
    "paddlepaddle>=2.5.0",
    "pytesseract>=0.3.10",
]

# Medium: Lite + EasyOCR (~850MB total)
medium = [
    "medical-ocr-trainer[lite]",
    "easyocr>=1.7.0",
]

# TrOCR: Medium + TrOCR (~2.3GB total, needs torch)
trocr = [
    "medical-ocr-trainer[medium]",
    "transformers>=4.36.0",
    "torch>=2.1.0",
    "sentencepiece>=0.1.99",
]

# Surya: Medium + Surya OCR (~1.6GB total, GPU recommended)
surya = [
    "medical-ocr-trainer[medium]",
    "surya-ocr>=0.4.5",
]

# Full: All engines (~3.1GB+ total, GPU recommended)
full = [
    "medical-ocr-trainer[trocr]",
    "medical-ocr-trainer[surya]",
]

# Development tools
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
medical-ocr-train = "medical_ocr_trainer.cli:main"

[tool.setuptools.packages.find]
include = ["evaluation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"
