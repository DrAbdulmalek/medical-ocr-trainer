[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-ocr-trainer"
version = "1.0.0"
description = "Medical OCR evaluation, data collection, and quality benchmarking toolkit"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Dr. Abdulmalek Tamer Al-husseini", email = "drabdulmalek@proton.me"}
]
keywords = ["ocr", "evaluation", "medical", "benchmarking", "cer", "wer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "rapidfuzz>=2.13.0",
    "rich>=13.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0"]
full = ["streamlit>=1.20.0", "transformers>=4.30.0", "torch>=2.0.0"]

[project.scripts]
ocr-eval = "evaluation.benchmark:main"

[tool.setuptools.packages.find]
include = ["evaluation*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
