name: Data Governance

on:
  schedule:
    # Weekly cleanup: every Sunday 3 AM UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      action:
        description: 'Governance action to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - cleanup
          - backup-check
          - db-stats

jobs:
  cleanup-expired-data:
    name: Cleanup Expired Data
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'all' || github.event.inputs.action == 'cleanup' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Check for expired files
        run: |
          echo "## Data Governance Report — $(date -u '+%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check uploads/ (should be empty in CI, but verify script exists)
          if [ -f scripts/cleanup_old_data.sh ]; then
            echo "### Cleanup Script Status" >> $GITHUB_STEP_SUMMARY
            echo "- cleanup_old_data.sh: OK" >> $GITHUB_STEP_SUMMARY
            echo "- Policy: Files older than 90 days are deleted" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Retention Policies" >> $GITHUB_STEP_SUMMARY
          echo "| Directory | Retention | Policy |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| uploads/ | 90 days | Auto-delete |" >> $GITHUB_STEP_SUMMARY
          echo "| crops/ | 90 days | Auto-delete |" >> $GITHUB_STEP_SUMMARY
          echo "| data/raw/ | 90 days | Auto-delete |" >> $GITHUB_STEP_SUMMARY
          echo "| exports/ | Indefinite | Keep all |" >> $GITHUB_STEP_SUMMARY
          echo "| data/golden/ | Indefinite | Git-tracked |" >> $GITHUB_STEP_SUMMARY
          echo "| data/corrections.db | Indefinite | Backup weekly |" >> $GITHUB_STEP_SUMMARY

  backup-verification:
    name: Verify Backup Scripts
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'all' || github.event.inputs.action == 'backup-check' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify backup script
        run: |
          echo "### Backup Script Verification" >> $GITHUB_STEP_SUMMARY

          if [ -f scripts/backup.sh ]; then
            echo "- backup.sh: OK" >> $GITHUB_STEP_SUMMARY
            # Verify script is executable and has no syntax errors
            bash -n scripts/backup.sh && echo "- Syntax check: PASSED" >> $GITHUB_STEP_SUMMARY || echo "- Syntax check: FAILED" >> $GITHUB_STEP_SUMMARY
          else
            echo "- backup.sh: MISSING" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f scripts/cleanup_old_data.sh ]; then
            echo "- cleanup_old_data.sh: OK" >> $GITHUB_STEP_SUMMARY
            bash -n scripts/cleanup_old_data.sh && echo "- Syntax check: PASSED" >> $GITHUB_STEP_SUMMARY || echo "- Syntax check: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Backup Policy" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Max backups kept | 30 |" >> $GITHUB_STEP_SUMMARY
          echo "| Backed up | corrections.db, exports/, data/golden/ |" >> $GITHUB_STEP_SUMMARY
          echo "| Encryption | Not configured (local only) |" >> $GITHUB_STEP_SUMMARY
          echo "| Cloud sync | Not configured |" >> $GITHUB_STEP_SUMMARY

  database-stats:
    name: Database Schema Validation
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'all' || github.event.inputs.action == 'db-stats' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate DB schema
        run: |
          echo "### Database Schema Validation" >> $GITHUB_STEP_SUMMARY

          python3 << 'PYEOF'
          import sqlite3
          import tempfile
          import os

          # Create a test DB to verify schema creation works
          db_path = tempfile.mktemp(suffix=".db")
          conn = sqlite3.connect(db_path)
          cursor = conn.cursor()

          # Verify expected tables can be created
          tables = [
              """CREATE TABLE IF NOT EXISTS images (
                  id INTEGER PRIMARY KEY, filename TEXT, path TEXT,
                  width INTEGER, height INTEGER, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
              )""",
              """CREATE TABLE IF NOT EXISTS words (
                  id INTEGER PRIMARY KEY, image_id INTEGER,
                  bbox TEXT, predicted_text TEXT, confidence REAL,
                  corrected_text TEXT, crop_path TEXT,
                  is_corrected INTEGER DEFAULT 0, corrected_at TIMESTAMP,
                  review_status TEXT DEFAULT 'pending',
                  is_gold_standard INTEGER DEFAULT 0,
                  script_class TEXT, correction_count INTEGER DEFAULT 0,
                  ensemble_strategy TEXT, engines_used TEXT,
                  agreement_count INTEGER, engine_votes TEXT,
                  FOREIGN KEY (image_id) REFERENCES images(id)
              )""",
              """CREATE TABLE IF NOT EXISTS engine_logs (
                  id INTEGER PRIMARY KEY, image_id INTEGER,
                  engine_name TEXT, word_count INTEGER,
                  processing_time REAL, raw_results TEXT,
                  created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
                  FOREIGN KEY (image_id) REFERENCES images(id)
              )""",
              """CREATE TABLE IF NOT EXISTS model_versions (
                  id INTEGER PRIMARY KEY, version TEXT,
                  trained_on_count INTEGER, cer REAL, wer REAL,
                  medical_accuracy REAL, deployed_at TIMESTAMP
              )""",
              """CREATE TABLE IF NOT EXISTS correction_history (
                  id INTEGER PRIMARY KEY, word_id INTEGER,
                  old_text TEXT, new_text TEXT,
                  confidence_at_correction REAL,
                  corrected_by TEXT, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
                  FOREIGN KEY (word_id) REFERENCES words(id)
              )"""
          ]

          for sql in tables:
              try:
                  cursor.execute(sql)
                  print(f"  - Table creation: OK")
              except Exception as e:
                  print(f"  - Table creation: FAILED - {e}")

          # Verify indexes
          indexes = [
              "CREATE INDEX IF NOT EXISTS idx_words_image_id ON words(image_id)",
              "CREATE INDEX IF NOT EXISTS idx_words_review_status ON words(review_status)",
              "CREATE INDEX IF NOT EXISTS idx_words_script_class ON words(script_class)",
              "CREATE INDEX IF NOT EXISTS idx_corrections_word_id ON correction_history(word_id)",
          ]

          for sql in indexes:
              try:
                  cursor.execute(sql)
                  print(f"  - Index creation: OK")
              except Exception as e:
                  print(f"  - Index creation: FAILED - {e}")

          conn.close()
          os.unlink(db_path)
          print("Schema validation: ALL PASSED")
          PYEOF

          # Write to step summary
          python3 -c "
          with open('$GITHUB_STEP_SUMMARY', 'a') as f:
              f.write('\n### Expected Tables\n')
              f.write('| Table | Purpose | Retention |\n')
              f.write('|-------|---------|----------|\n')
              f.write('| images | Uploaded document metadata | With uploads (90d) |\n')
              f.write('| words | OCR results + corrections | With DB (indefinite) |\n')
              f.write('| engine_logs | Per-engine per-image results | With DB (indefinite) |\n')
              f.write('| model_versions | Training version tracking | With DB (indefinite) |\n')
              f.write('| correction_history | Full audit trail | With DB (indefinite) |\n')
          "